<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6fb;
    color: #25324b;
}

header {
    background: #172b4d;
    color: white;
    padding: 25px 7%;
}

header h1 {
    font-size: 25px;
    margin-bottom: 7px;
}

header p {
    color: #cbd5e1;
    font-size: 14px;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat-card, .panel {
    background: white;
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.05);
}

.stat-card p {
    color: #718096;
    font-size: 14px;
}

.stat-card h2 {
    margin-top: 10px;
    color: #2457a6;
    font-size: 28px;
}

.panel {
    margin-bottom: 25px;
}

.panel h2 {
    font-size: 19px;
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #dce2ec;
    border-radius: 6px;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: #2457a6;
}

button {
    padding: 11px 17px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.submit-btn {
    margin-top: 18px;
    background: #2457a6;
    color: white;
}

.submit-btn:hover {
    background: #183e7b;
}

.search {
    max-width: 300px;
    margin-bottom: 18px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 15px 12px;
    text-align: left;
    border-bottom: 1px solid #edf0f5;
    font-size: 14px;
}

th {
    background: #f8f9fc;
    color: #64748b;
}

.edit-btn {
    background: #e7efff;
    color: #2457a6;
    margin-right: 5px;
}

.delete-btn {
    background: #feecec;
    color: #d33;
}

#message {
    margin-bottom: 15px;
    font-size: 14px;
    color: #187b48;
}

@media(max-width:650px) {
    .stats, .form-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>Student Management System</h1>
    <p>Admin Dashboard | Manage Student Records</p>
</header>

<div class="container">

    <div class="stats">
        <div class="stat-card">
            <p>Total Students</p>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="stat-card">
            <p>Departments</p>
            <h2 id="totalDepartments">0</h2>
        </div>

        <div class="stat-card">
            <p>System Status</p>
            <h2 style="font-size:20px;color:#15945b;">Active</h2>
        </div>
    </div>

    <div class="panel">
        <h2 id="formTitle">Add New Student</h2>

        <p id="message"></p>

        <form id="studentForm">
            <div class="form-grid">

                <input id="name" type="text"
                    placeholder="Student Name" required>

                <input id="rollNumber" type="text"
                    placeholder="Roll Number" required>

                <input id="department" type="text"
                    placeholder="Department" required>

                <input id="email" type="email"
                    placeholder="Email Address" required>

            </div>

            <button class="submit-btn" type="submit" id="submitButton">
                + Add Student
            </button>

            <button type="button" id="cancelButton"
                style="display:none;background:#e5e7eb;">
                Cancel Edit
            </button>
        </form>
    </div>

    <div class="panel">
        <h2>Registered Students</h2>

        <input class="search" id="search"
            placeholder="Search students...">

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Department</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <tr>
                        <td colspan="5">Loading students...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
let students = [];
let editingId = null;

const form = document.getElementById("studentForm");
const message = document.getElementById("message");

function showMessage(text, isError = false) {
    message.textContent = text;
    message.style.color = isError ? "#d33" : "#15945b";
}

async function loadStudents() {
    try {
        const response = await fetch("/api/students");

        if (!response.ok) throw new Error("Unable to load students");

        students = await response.json();
        renderStudents();
    } catch (error) {
        showMessage("Could not connect to the server.", true);
    }
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function renderStudents() {
    const table = document.getElementById("studentTable");
    const search = document.getElementById("search").value.toLowerCase();

    const filtered = students.filter(student =>
        [student.name, student.rollNumber,
         student.department, student.email]
        .some(value => value.toLowerCase().includes(search))
    );

    document.getElementById("totalStudents").textContent =
        students.length;

    document.getElementById("totalDepartments").textContent =
        new Set(students.map(s => s.department.toLowerCase())).size;

    if (filtered.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="5" style="text-align:center;padding:30px;">
                    No students found.
                </td>
            </tr>`;
        return;
    }

    table.innerHTML = filtered.map(student => `
        <tr>
            <td>${escapeHTML(student.name)}</td>
            <td>${escapeHTML(student.rollNumber)}</td>
            <td>${escapeHTML(student.department)}</td>
            <td>${escapeHTML(student.email)}</td>
            <td>
                <button class="edit-btn"
                    data-action="edit"
                    data-id="${escapeHTML(student.id)}">
                    Edit
                </button>

                <button class="delete-btn"
                    data-action="delete"
                    data-id="${escapeHTML(student.id)}">
                    Delete
                </button>
            </td>
        </tr>
    `).join("");
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const student = {
        name: document.getElementById("name").value.trim(),
        rollNumber: document.getElementById("rollNumber").value.trim(),
        department: document.getElementById("department").value.trim(),
        email: document.getElementById("email").value.trim()
    };

    try {
        const response = await fetch(
            editingId
                ? `/api/students/${editingId}`
                : "/api/students",
            {
                method: editingId ? "PUT" : "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(student)
            }
        );

        const result = await response.json();

        if (!response.ok) throw new Error(result.error);

        showMessage(editingId
            ? "Student updated successfully!"
            : "Student added successfully!");

        resetForm();
        await loadStudents();

    } catch (error) {
        showMessage(error.message || "Something went wrong.", true);
    }
});

document.getElementById("studentTable").addEventListener(
    "click", async function(event) {

    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const id = button.dataset.id;
    const action = button.dataset.action;

    const student = students.find(s => s.id === id);
    if (!student) return;

    if (action === "edit") {
        editingId = id;

        document.getElementById("name").value = student.name;
        document.getElementById("rollNumber").value = student.rollNumber;
        document.getElementById("department").value = student.department;
        document.getElementById("email").value = student.email;

        document.getElementById("formTitle").textContent = "Edit Student";
        document.getElementById("submitButton").textContent = "Update Student";
        document.getElementById("cancelButton").style.display = "inline-block";

        showMessage("Editing " + student.name);
        window.scrollTo({top: 0, behavior: "smooth"});
    }

    if (action === "delete") {
        if (!confirm("Are you sure you want to delete this student?")) {
            return;
        }

        try {
            const response = await fetch(`/api/students/${id}`, {
                method: "DELETE"
            });

            const result = await response.json();

            if (!response.ok) throw new Error(result.error);

            showMessage("Student deleted successfully!");
            await loadStudents();

        } catch (error) {
            showMessage(error.message, true);
        }
    }
});

function resetForm() {
    form.reset();
    editingId = null;

    document.getElementById("formTitle").textContent = "Add New Student";
    document.getElementById("submitButton").textContent = "+ Add Student";
    document.getElementById("cancelButton").style.display = "none";
}

document.getElementById("cancelButton").addEventListener(
    "click", resetForm
);

document.getElementById("search").addEventListener(
    "input", renderStudents
);

loadStudents();
</script>

</body>
</html>
